name: "Fork Build - Windows and Linux"

# Unsigned installers for the bjhiltbrand/meetily fork (Windows + Linux, no macOS).
# Needs no upstream secrets: Windows code signing is skipped when
# DIGICERT_KEYPAIR_ALIAS is unset, and updater artifacts are disabled in
# tauri.conf.json.

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - release
          - debug
        default: release
  push:
    branches:
      - feature/speaker-diarization
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'backend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Windows installer (x64, Vulkan)
    # Only run in the fork, never in upstream or other forks
    if: github.repository == 'bjhiltbrand/meetily'
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version and build profile
        id: meta
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event.inputs.build-type }}" == "debug" ]]; then
            echo "profile=debug" >> "$GITHUB_OUTPUT"
            echo "args=--debug" >> "$GITHUB_OUTPUT"
          else
            echo "profile=release" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configure portable Windows native build
        id: windows-portability
        shell: pwsh
        env:
          PORTABLE_BUILD_PROFILE: ${{ steps.meta.outputs.profile }}
        run: |
          $cmakeHook = (Join-Path $env:GITHUB_WORKSPACE ".github/force-portable-ggml.cmake").Replace('\', '/')
          "CMAKE_PROJECT_INCLUDE=$cmakeHook" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTFLAGS=-C target-cpu=x86-64-v2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $buildDirectory = "target/x86_64-pc-windows-msvc/$env:PORTABLE_BUILD_PROFILE"
          $configPath = (Join-Path $env:RUNNER_TEMP "tauri.windows-portable.conf.json").Replace('\', '/')
          @{
            build = @{
              beforeBundleCommand = @{
                script = "node .github/verify-portable-ggml.cjs $buildDirectory"
                cwd = $env:GITHUB_WORKSPACE
              }
            }
          } | ConvertTo-Json -Depth 4 | Set-Content -Path $configPath -Encoding utf8
          "args=--config `"$configPath`"" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          prefix-key: fork-windows-portable-v1
          key: windows-x64-vulkan

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Configure Vulkan SDK and bundle runtime
        shell: pwsh
        run: |
          $vulkanSdk = $env:VULKAN_SDK
          if (-not $vulkanSdk -or -not (Test-Path $vulkanSdk)) {
            Write-Error "VULKAN_SDK not set or path does not exist"
            exit 1
          }
          $binDir = Join-Path $vulkanSdk "Bin"
          $libDir = Join-Path $vulkanSdk "Lib"
          "PATH=$binDir;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Vulkan_LIBRARY=$libDir\vulkan-1.lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Vulkan_INCLUDE_DIR=$(Join-Path $vulkanSdk 'Include')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VK_SDK_PATH=$vulkanSdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $runtimeDir = "frontend/src-tauri/vulkan-runtime"
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          $vulkanDll = @(
            "$vulkanSdk\Bin\vulkan-1.dll",
            "$vulkanSdk\runtime\x64\vulkan-1.dll",
            "$env:SystemRoot\System32\vulkan-1.dll"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($vulkanDll) {
            Copy-Item $vulkanDll -Destination $runtimeDir
            Write-Host "Copied $vulkanDll to $runtimeDir"
          } else {
            Write-Warning "vulkan-1.dll not found; the app will rely on the user's installed Vulkan runtime"
          }

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Build llama-helper sidecar (CPU-only)
        shell: pwsh
        run: |
          cargo build --release -p llama-helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path "frontend/src-tauri/binaries" | Out-Null
          Copy-Item "target/release/llama-helper.exe" -Destination "frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe"

      - name: Cache FFmpeg binary
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/binaries/ffmpeg-*.exe
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('frontend/src-tauri/build.rs', 'frontend/src-tauri/build/ffmpeg.rs') }}

      - name: Cache Windows ONNX Runtime
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/binaries/onnxruntime
          key: ${{ runner.os }}-onnxruntime-x86_64-pc-windows-msvc-${{ hashFiles('frontend/src-tauri/build/onnxruntime.rs') }}

      - name: Build Tauri app
        shell: pwsh
        working-directory: frontend
        run: |
          pnpm tauri build --target x86_64-pc-windows-msvc --features vulkan --bundles msi,nsis ${{ steps.meta.outputs.args }} ${{ steps.windows-portability.outputs.args }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: meetily-fork-windows-x64-${{ steps.meta.outputs.profile }}-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
          path: |
            target/x86_64-pc-windows-msvc/${{ steps.meta.outputs.profile }}/bundle/msi/*.msi
            target/x86_64-pc-windows-msvc/${{ steps.meta.outputs.profile }}/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        shell: bash
        run: |
          BUNDLE=target/x86_64-pc-windows-msvc/${{ steps.meta.outputs.profile }}/bundle
          {
            echo "## Windows installer (fork, unsigned)"
            echo ""
            echo "Version ${{ steps.meta.outputs.version }}, commit ${{ steps.meta.outputs.sha }}, ${{ steps.meta.outputs.profile }}, Vulkan"
            echo ""
            echo '```'
            find "$BUNDLE" -type f \( -name "*.msi" -o -name "*.exe" \) -exec ls -lh {} \; 2>/dev/null
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

  build-linux:
    name: Linux package (x64, Ubuntu 22.04, OpenBLAS)
    # Only run in the fork, never in upstream or other forks
    if: github.repository == 'bjhiltbrand/meetily'
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version and build profile
        id: meta
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event.inputs.build-type }}" == "debug" ]]; then
            echo "profile=debug" >> "$GITHUB_OUTPUT"
            echo "args=--debug" >> "$GITHUB_OUTPUT"
          else
            echo "profile=release" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          prefix-key: fork-linux-v1
          key: ubuntu-22.04-x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Build llama-helper sidecar (CPU-only)
        run: |
          cargo build --release -p llama-helper
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu

      - name: Build Tauri app
        working-directory: frontend
        run: |
          pnpm tauri build --target x86_64-unknown-linux-gnu --features openblas --bundles deb ${{ steps.meta.outputs.args }}

      - name: Verify DEB package
        run: |
          DEB_PATH=$(find target/x86_64-unknown-linux-gnu/${{ steps.meta.outputs.profile }}/bundle/deb -name "*.deb" | head -1)
          dpkg-deb --info "$DEB_PATH"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: meetily-fork-linux-x64-${{ steps.meta.outputs.profile }}-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
          path: |
            target/x86_64-unknown-linux-gnu/${{ steps.meta.outputs.profile }}/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          BUNDLE=target/x86_64-unknown-linux-gnu/${{ steps.meta.outputs.profile }}/bundle
          {
            echo "## Linux package (fork)"
            echo ""
            echo "Version ${{ steps.meta.outputs.version }}, commit ${{ steps.meta.outputs.sha }}, ${{ steps.meta.outputs.profile }}, OpenBLAS"
            echo ""
            echo '```'
            find "$BUNDLE" -type f -name "*.deb" -exec ls -lh {} \; 2>/dev/null
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
